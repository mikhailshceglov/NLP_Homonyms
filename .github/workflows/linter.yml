name: Linter 

on:
  push:
    branches: ["main", "master"]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install flake8
        run: pip install pip flake8 

      - name: Run flake8
        run: flake8 .
